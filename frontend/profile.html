
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - IoT System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <a class="brand-small" href="dashboard.html">
                <span class="brand-mark small">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="6" y="6" width="12" height="12" rx="2"/>
                        <path d="M9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/>
                        <path d="M10 10h4v4h-4z"/>
                    </svg>
                </span>

                <b>IoT System</b>
            </a>

            <!-- Navigation menu -->
            <nav class="side-nav">

                <a class="menu" href="dashboard.html">
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/>
                            <rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/>
                            <rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/>
                            <rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>
                        </svg>
                    </span>
                    Dashboard
                </a>

                <a class="menu" href="sensor-data.html">
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12h3l3-8 5 16 3-8h6"/>
                        </svg>
                    </span>
                    Sensor Data
                </a>

                <a class="menu" href="activity-history.html">
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="8.5"/>
                            <path d="M12 7v5l3.5 2"/>
                        </svg>
                    </span>
                    Activity History
                </a>

                <a class="menu active" href="profile.html">
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="8" r="3.2"/>
                            <path d="M5 20c.7-3.5 3.1-5.3 7-5.3s6.3 1.8 7 5.3"/>
                        </svg>
                    </span>
                    Profile
                </a>

            </nav>

            <!-- Logout button -->
            <button class="logout" onclick="handleLogout()">
                <span>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M10 17l5-5-5-5M15 12H3"/>
                        <path d="M13 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/>
                    </svg>
                </span>
                Logout
            </button>

        </aside>

        <!-- Main content -->
        <main class="main">

            <!-- Page header -->
            <header class="top-header">
                <div>
                    <span class="eyebrow">ACCOUNT</span>
                    <h1>Profile</h1>
                </div>
            </header>

            <!-- Profile information -->
            <section class="content profile-content">

                <div class="profile-layout">

                    <!-- Profile summary -->
                    <article class="profile-summary">

                        <div class="avatar">
                            <img src="anh.jpg" alt="Profile Avatar">
                        </div>

                        <h2 id="profileName">Nguyễn Đức Minh</h2>

                        <span class="role-pill" id="profileRole">
                            ADMINISTRATOR
                        </span>

                    </article>

                    <!-- Profile details -->
                    <article class="profile-details">

                        <div class="profile-card-title">
                            PERSONAL INFORMATION
                        </div>

                        <div class="profile-row">
                            <span>Full Name</span>
                            <strong id="profileFullName">Nguyễn Đức Minh</strong>
                        </div>

                        <div class="profile-row">
                            <span>MSV</span>
                            <strong id="profileMSV">B23DCCN555</strong>
                        </div>

                        <div class="profile-row">
                            <span>Role</span>
                            <strong id="profileRoleDetail">Administrator</strong>
                        </div>

                        <div class="profile-card-title">
                            PERSONAL LINKS
                        </div>

                        <div class="profile-row">
                            <span>GitHub</span>
                            <strong>
                                <a id="profileGithub" href="#" target="_blank" rel="noopener noreferrer">GitHub</a>
                            </strong>
                        </div>

                        <div class="profile-row">
                            <span>Figma</span>
                            <strong>
                                <a id="profileFigma" href="#" target="_blank" rel="noopener noreferrer">Figma</a>
                            </strong>
                        </div>

                        <div class="profile-row">
                            <span>Document</span>
                            <strong>
                                <a id="profileDocument" href="#" target="_blank" rel="noopener noreferrer">Document</a>
                            </strong>
                        </div>

                    </article>

                </div>

            </section>

        </main>

    </div>

    <script src="app.js"></script>

</body>
</html>
