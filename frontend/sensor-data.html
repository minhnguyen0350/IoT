
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sensor Data - IoT System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="table-page">

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <a class="brand-small" href="dashboard.html">
                <span class="brand-mark small">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <rect x="6" y="6" width="12" height="12" rx="2"/>
                      <path d="M9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/>
                      <path d="M10 10h4v4h-4z"/>
                  </svg>
                </span>

                <b>IoT System</b>
            </a>


            <!-- Navigation menu -->
            <nav class="side-nav">

                <a class="menu" href="dashboard.html">
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/>
                            <rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/>
                            <rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/>
                            <rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>
                        </svg>
                    </span>
                    Dashboard
                </a>


                <a class="menu active" href="sensor-data.html">
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                          <path d="M2 12h3l3-8 5 16 3-8h6"/>
                      </svg>
                    </span>
                    Sensor Data
                </a>


                <a class="menu" href="activity-history.html">
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="8.5"/>
                            <path d="M12 7v5l3.5 2"/>
                        </svg>
                    </span>
                    Activity History
                </a>


                <a class="menu" href="profile.html">
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="8" r="3.2"/>
                            <path d="M5 20c.7-3.5 3.1-5.3 7-5.3s6.3 1.8 7 5.3"/>
                        </svg>
                    </span>
                    Profile
                </a>

            </nav>


            <!-- Logout button -->
            <button class="logout" onclick="handleLogout()">
                <span>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M10 17l5-5-5-5M15 12H3"/>
                        <path d="M13 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/>
                    </svg>
                </span>
                Logout
            </button>

        </aside>


        <!-- Main content -->
        <main class="main">

            <!-- Page header -->
            <header class="top-header">
                <div>
                    <span class="eyebrow">MONITORING</span>
                    <h1>Sensor Data</h1>
                </div>
            </header>


            <!-- Sensor data section -->
            <section class="content table-content">

                <!-- Search and filter -->
                <div class="filter-box sensor-filter">

                    <div class="search-field">
                        <label for="sensorKeyword">
                            Search
                        </label>

                        <input
                            id="sensorKeyword"
                            type="text"
                            placeholder="Search..."
                        >
                    </div>


                    <div class="filter-item">
                        <label for="sensorCategory">
                            Type
                        </label>

                        <select
                            id="sensorCategory"
                            class="sensor-select"
                        >
                            <option value="All">All</option>
                            <option value="Temperature">Temperature</option>
                            <option value="Humidity">Humidity</option>
                            <option value="Light">Light</option>
                            <option value="Time">Time</option>
                        </select>
                    </div>


                    <button
                        class="btn btn-primary search-button"
                        type="button"
                    >
                        Search
                    </button>

                    <button
                        class="btn btn-light reset-button"
                        type="button"
                    >
                        Reset
                    </button>

                </div>


                <!-- Sensor data table -->
                <div class="table-card">

                    <div class="table-scroll">

                        <table>

                            <thead>
                                <tr>
                                    <th>STT</th>
                                    <th>Sensor</th>
                                    <th>Value</th>
                                    <th>Unit</th>
                                    <th>Time</th>
                                </tr>
                            </thead>

                            <tbody id="sensorTableBody">
                            </tbody>

                        </table>

                    </div>


                    <!-- Pagination -->
                    <div class="pagination">

                        <label class="page-size-control">
                            Hiển thị

                            <select class="page-size-select">
                                <option>10</option>
                                <option>20</option>
                                <option>50</option>
                            </select>

                            dòng / trang
                        </label>

                        <div class="page-numbers"></div>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <script src="app.js"></script>

</body>
</html>
