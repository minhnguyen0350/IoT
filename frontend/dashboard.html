
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - IoT System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <!-- Logo -->
            <a class="brand-small" href="dashboard.html">
                <span class="brand-mark small">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <rect x="6" y="6" width="12" height="12" rx="2"/>
                      <path d="M9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/>
                      <path d="M10 10h4v4h-4z"/>
                  </svg>
                </span>
                <b>IoT System</b>
            </a>

            <!-- Navigation -->
            <nav class="side-nav">

                <a class="menu active" href="dashboard.html">
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/>
                            <rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/>
                            <rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/>
                            <rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>
                        </svg>
                    </span>
                    Dashboard
                </a>

                <a class="menu" href="sensor-data.html">
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                          <path d="M2 12h3l3-8 5 16 3-8h6"/>
                      </svg>
                    </span>
                    Sensor Data
                </a>

                <a class="menu" href="activity-history.html">
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="8.5"/>
                            <path d="M12 7v5l3.5 2"/>
                        </svg>
                    </span>
                    Activity History
                </a>

                <a class="menu" href="profile.html">
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="8" r="3.2"/>
                            <path d="M5 20c.7-3.5 3.1-5.3 7-5.3s6.3 1.8 7 5.3"/>
                        </svg>
                    </span>
                    Profile
                </a>

            </nav>

            <!-- Logout -->
            <button class="logout" onclick="handleLogout()">
                <span>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M10 17l5-5-5-5M15 12H3"/>
                        <path d="M13 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/>
                    </svg>
                </span>
                Logout
            </button>

        </aside>

        <!-- Main content -->
        <main class="main">

            <!-- Header -->
            <header class="top-header">
                <div>
                    <span class="eyebrow">OVERVIEW</span>
                    <h1>Dashboard</h1>
                </div>

                <span class="date-label" id="todayLabel"></span>
            </header>

            <!-- Dashboard content -->
            <section class="content dashboard-content">

                <!-- Sensor summary cards -->
                <div class="sensor-cards">

                    <!-- Temperature -->
                    <article class="sensor-card">
                        <div>
                            <span class="sensor-title">Temperature</span>

                            <strong class="sensor-value" id="temperatureSummary">
                                -- <small>°C</small>
                            </strong>
                        </div>

                        <span class="sensor-icon temp">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M8 20c-2-2 1-3 0-5s-1-3 1-5M14 20c-2-2 1-3 0-5s-1-3 1-5M18 20c-2-2 1-3 0-5"/>
                            </svg>
                        </span>
                    </article>

                    <!-- Humidity -->
                    <article class="sensor-card">
                        <div>
                            <span class="sensor-title">Humidity</span>

                            <strong class="sensor-value" id="humiditySummary">
                                -- <small>%</small>
                            </strong>
                        </div>

                        <span class="sensor-icon hum">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 3C9 7 6.5 10 6.5 13.5a5.5 5.5 0 0 0 11 0C17.5 10 15 7 12 3Z"/>
                            </svg>
                        </span>
                    </article>

                    <!-- Light -->
                    <article class="sensor-card">
                        <div>
                            <span class="sensor-title">Light</span>

                            <strong class="sensor-value" id="lightSummary">
                                -- <small>ADC</small>
                            </strong>
                        </div>

                        <span class="sensor-icon light">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="12" r="4"/>
                                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                            </svg>
                        </span>
                    </article>

                </div>

                <!-- Main dashboard grid -->
                <div class="dashboard-main-grid">

                    <!-- Sensor analytics -->
                    <section class="dashboard-analytics">

                        <div class="section-heading">
                            <div>
                                <h2>Sensor Data Overview</h2>
                            </div>

                            <!-- Time filters -->
                            <div class="time-filters">
                                <button class="time-btn active" data-range="today">
                                    Today
                                </button>

                                <button class="time-btn" data-range="7days">
                                    1 Week
                                </button>

                                <button class="time-btn" data-range="month">
                                    1 Month
                                </button>
                            </div>
                        </div>

                        <!-- Sensor charts -->
                        <div class="charts dashboard-charts">

                            <!-- Temperature chart -->
                            <article class="chart-card">
                                <div class="chart-title">
                                    <span>
                                        <i class="dot red"></i>
                                        Temperature
                                    </span>

                                    <span>°C</span>
                                </div>

                                <strong class="chart-current" id="temperatureCurrent">
                                    -- °C
                                </strong>

                                <div class="chart">
                                    <svg
                                        id="temperatureChart"
                                        viewBox="0 0 500 210"
                                        preserveAspectRatio="none"
                                    ></svg>
                                </div>

                                <div class="chart-footer">
                                    <span id="temperatureMin">Min --</span>
                                    <span id="temperatureMax">Max --</span>
                                </div>
                            </article>

                            <!-- Humidity chart -->
                            <article class="chart-card">
                                <div class="chart-title">
                                    <span>
                                        <i class="dot blue"></i>
                                        Humidity
                                    </span>

                                    <span>%</span>
                                </div>

                                <strong class="chart-current" id="humidityCurrent">
                                    -- %
                                </strong>

                                <div class="chart">
                                    <svg
                                        id="humidityChart"
                                        viewBox="0 0 500 210"
                                        preserveAspectRatio="none"
                                    ></svg>
                                </div>

                                <div class="chart-footer">
                                    <span id="humidityMin">Min --</span>
                                    <span id="humidityMax">Max --</span>
                                </div>
                            </article>

                            <!-- Light chart -->
                            <article class="chart-card">
                                <div class="chart-title">
                                    <span>
                                        <i class="dot orange"></i>
                                        Light
                                    </span>

                                    <span>ADC</span>
                                </div>

                                <strong class="chart-current" id="lightCurrent">
                                    -- ADC
                                </strong>

                                <div class="chart">
                                    <svg
                                        id="lightChart"
                                        viewBox="0 0 500 210"
                                        preserveAspectRatio="none"
                                    ></svg>
                                </div>

                                <div class="chart-footer">
                                    <span id="lightMin">Min --</span>
                                    <span id="lightMax">Max --</span>
                                </div>
                            </article>

                        </div>

                    </section>

                    <!-- Light control -->
                    <section class="dashboard-device-panel">

                        <div class="section-heading led-heading">
                            <div>
                                <h2>Light Control</h2>
                            </div>

                            <span class="device-count">2 Devices</span>
                        </div>

                        <!-- LED controls -->
                        <div class="light-controls dashboard-light-controls">

                            <!-- LED 01 -->
                            <article class="light-card">

                                <span class="bulb active-bulb" id="bulb1">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M9 18h6M10 21h4M8.2 14.5a7 7 0 1 1 7.6 0c-.8.6-1.3 1.4-1.5 2.5h-4.6c-.2-1.1-.7-1.9-1.5-2.5Z"/>
                                    </svg>
                                </span>

                                <div class="light-info">
                                    <h3>LED 01</h3>
                                    <span class="status on" id="led1Status">ON</span>
                                </div>

                                <button
                                    id="led1"
                                    class="switch on"
                                    onclick="setLedPower(1)"
                                    aria-label="Toggle LED 01"
                                >
                                    <span class="knob"></span>
                                </button>

                            </article>

                            <!-- LED 02 -->
                            <article class="light-card">

                                <span class="bulb active-bulb" id="bulb2">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M9 18h6M10 21h4M8.2 14.5a7 7 0 1 1 7.6 0c-.8.6-1.3 1.4-1.5 2.5h-4.6c-.2-1.1-.7-1.9-1.5-2.5Z"/>
                                    </svg>
                                </span>

                                <div class="light-info">
                                    <h3>LED 02</h3>
                                    <span class="status on" id="led2Status">ON</span>
                                </div>

                                <button
                                    id="led2"
                                    class="switch on"
                                    onclick="setLedPower(2)"
                                    aria-label="Toggle LED 02"
                                >
                                    <span class="knob"></span>
                                </button>

                            </article>

                        </div>

                    </section>

                </div>

            </section>

        </main>

    </div>

    <script src="app.js"></script>

</body>
</html>
