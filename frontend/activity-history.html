
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Activity History - IoT System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="table-page">
    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <a class="brand-small" href="dashboard.html">
                <span class="brand-mark small">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <rect x="6" y="6" width="12" height="12" rx="2"/>
                      <path d="M9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/>
                      <path d="M10 10h4v4h-4z"/>
                  </svg>
                </span>
                <b>IoT System</b>
            </a>

            <nav class="side-nav">

                <a class="menu" href="dashboard.html">
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/>
                            <rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/>
                            <rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/>
                            <rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>
                        </svg>
                    </span>
                    Dashboard
                </a>

                <a class="menu" href="sensor-data.html">
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                          <path d="M2 12h3l3-8 5 16 3-8h6"/>
                      </svg>
                    </span>
                    Sensor Data
                </a>

                <a class="menu active" href="activity-history.html">
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="8.5"/>
                            <path d="M12 7v5l3.5 2"/>
                        </svg>
                    </span>
                    Activity History
                </a>

                <a class="menu" href="profile.html">
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="8" r="3.2"/>
                            <path d="M5 20c.7-3.5 3.1-5.3 7-5.3s6.3 1.8 7 5.3"/>
                        </svg>
                    </span>
                    Profile
                </a>

            </nav>

            <button class="logout" onclick="handleLogout()">
                <span>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M10 17l5-5-5-5M15 12H3"/>
                        <path d="M13 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/>
                    </svg>
                </span>
                Logout
            </button>

        </aside>

        <!-- Main content -->
        <main class="main">

            <header class="top-header">
                <div>
                    <span class="eyebrow">DEVICE LOGS</span>
                    <h1>Activity History</h1>
                </div>
            </header>

            <section class="content table-content">

                <!-- Filter section -->
                <div class="filter-box history-filter">

                    <div class="search-field">
                        <label for="activityTimeKeyword">Time</label>
                        <input
                            id="activityTimeKeyword"
                            type="text"
                            placeholder="Search..."
                        >
                    </div>

                    <div class="filter-item">
                        <label for="activityDeviceFilter">Device</label>
                        <select id="activityDeviceFilter">
                            <option>All</option>
                            <option>LED 01</option>
                            <option>LED 02</option>
                        </select>
                    </div>

                    <div class="filter-item">
                        <label for="activityActionFilter">Action</label>
                        <select id="activityActionFilter">
                            <option>All</option>
                            <option>ON</option>
                            <option>OFF</option>
                        </select>
                    </div>

                    <div class="filter-item">
                        <label for="activityStatusFilter">Status</label>
                        <select id="activityStatusFilter">
                            <option>All</option>
                            <option>SUCCESS</option>
                            <option>LOADING</option>
                            <option>FAILED</option>
                        </select>
                    </div>

                    <button class="btn btn-primary search-button" type="button">
                        Search
                    </button>

                    <button class="btn btn-light reset-button" type="button">
                        Reset
                    </button>

                </div>

                <!-- Activity table -->
                <div class="table-card">

                    <div class="table-scroll">
                        <table>

                            <thead>
                                <tr>
                                    <th>STT</th>
                                    <th>User</th>
                                    <th>Device</th>
                                    <th>Action</th>
                                    <th>Status</th>
                                    <th>Time</th>
                                </tr>
                            </thead>

                            <tbody id="activityTableBody"></tbody>

                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="pagination">

                        <label class="page-size-control">
                            Hiển thị

                            <select class="page-size-select">
                                <option>10</option>
                                <option>20</option>
                                <option>50</option>
                            </select>

                            dòng / trang
                        </label>

                        <div class="page-numbers"></div>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <script src="app.js"></script>
</body>
</html>
